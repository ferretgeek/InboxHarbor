name: Bug report
description: Report a reproducible non-security defect using synthetic data only.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include real email addresses, client IDs, tokens, messages, codes, hosts, screenshots, or logs. Use Private vulnerability reporting for security issues.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe expected and actual behavior with synthetic data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and environment
      placeholder: v1.0.0, Python 3.13, Windows 11
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed all real identities, credentials, messages, hosts, paths, and screenshots.
          required: true
